name: build-installers
on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: node --test
      - run: node tools/scan-secrets.mjs

  windows-exe:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: powershell -ExecutionPolicy Bypass -File packaging\windows\build-exe.ps1
      - uses: actions/upload-artifact@v4
        with: { name: ClaudeOmniRouteSetup-exe, path: dist/ClaudeOmniRouteSetup.exe }

  macos-pkg:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: sh packaging/macos/build-pkg.sh "${GITHUB_REF_NAME#v}"
      - uses: actions/upload-artifact@v4
        with: { name: ClaudeOmniRouteSetup-pkg, path: dist/ClaudeOmniRouteSetup.pkg }

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows-exe, macos-pkg]
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with: { files: out/* }
